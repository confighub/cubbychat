apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/confighub/cubbychat/backend:1.1.7
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: OLLAMA_ENABLED
              value: "false"  # base ships in non-AI mode; the `ai` component flips this to "true"
            - name: DATABASE_URL
              value: "postgres://admin:password@postgres:5432/chatdb"
            - name: CHAT_TITLE
              value: "Cubby Chat"
            - name: PORT
              value: "8080"
            - name: REGION
              value: "dev"
            - name: ROLE
              value: "development"
          resources:
            requests:
              memory: "100Mi"
            limits:
              memory: "200Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
