apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
# images: declares the names overridable by `installer setup --set-image`.
# The default values match what's hard-coded in the manifests; --set-image
# rewrites them at render time without editing the source.
images:
  - name: ghcr.io/confighub/cubbychat/backend
    newName: ghcr.io/confighub/cubbychat/backend
    newTag: 1.1.7
  - name: ghcr.io/confighub/cubbychat/frontend
    newName: ghcr.io/confighub/cubbychat/frontend
    newTag: 1.1.7
  - name: postgres
    newName: postgres
    newTag: "16"
