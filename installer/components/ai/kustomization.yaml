apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ollama.yaml
# Flip the backend into AI mode. Strategic-merge on the env list (merge key
# is `name`), so only OLLAMA_ENABLED is touched — every other env var the
# base sets is left intact.
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: OLLAMA_ENABLED
                    value: "true"
# Lets `installer setup --set-image ollama/ollama=...` work when the AI
# component is selected.
images:
  - name: ollama/ollama
    newName: ollama/ollama
    newTag: 0.11.11
